[project]
name = "ygg-harbor"
version = "0.1.0"
description = "Harbor agent adapter for Yggdrasil: runs the factory against a Harbor task environment"
requires-python = ">=3.12"
dependencies = ["harbor==0.24.0"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
